# Pushing a tag like v1.2.0 runs the tests, builds the signed Windows installer
# and latest.json (what installed copies check for updates), and attaches them to
# a draft release. Review the draft's notes and publish it: installed copies only
# see an update once the release is published as the latest one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The Rust build embeds tauri-ui-dist/, which isn't in git.
      - name: Tests
        run: |
          node build-ui.js
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The key that signs updates; its public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'Download the `_x64-setup.exe` installer below.'
          releaseDraft: true
          includeUpdaterJson: true
