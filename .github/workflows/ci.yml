# Runs the Rust tests on every push and pull request, so a break shows up right
# away instead of when a release is tagged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The Rust build embeds tauri-ui-dist/, which isn't in git.
      - name: Tests
        run: |
          node build-ui.js
          cargo test --manifest-path src-tauri/Cargo.toml
