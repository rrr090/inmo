<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Timer</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
  }

  .widget {
    -webkit-app-region: drag;
    width: 240px;
    height: 84px;
    background: rgba(17, 17, 22, 0.94);
    border: 1px solid rgba(16, 185, 129, 0.5);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 16px;
    box-sizing: border-box;
    color: #f3f4f6;
    cursor: pointer;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .left {
    display: flex;
    align-items: center;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    animation: pulse 1.2s infinite ease-in-out;
    margin-right: 8px;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .time {
    font-family: 'Consolas', 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.5px;
  }

  .course {
    font-size: 11px;
    color: #9ca3af;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 4px;
  }

  .stop-btn {
    -webkit-app-region: no-drag;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.5);
    color: #ef4444;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 5px 9px;
    cursor: pointer;
  }
  .stop-btn:hover { background: rgba(239, 68, 68, 0.3); }
</style>
</head>
<body>
  <div class="widget" id="widget" title="Click to return to INMO">
    <div class="row">
      <div class="left">
        <span class="dot"></span>
        <span class="time" id="time">00:00:00</span>
      </div>
      <button class="stop-btn" id="stop-btn">STOP</button>
    </div>
    <div class="course" id="course">No active subject</div>
  </div>

  <script>
    window.miniApi.onTimerState((data) => {
      document.getElementById('time').innerText = (data && data.timeStr) || '00:00:00';
      document.getElementById('course').innerText = (data && data.courseLabel) || 'No active subject';
    });

    document.getElementById('widget').addEventListener('click', (e) => {
      if (e.target.id === 'stop-btn') return;
      window.miniApi.restoreMainWindow();
    });

    document.getElementById('stop-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      window.miniApi.stopTimer();
    });
  </script>
</body>
</html>
