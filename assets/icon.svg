<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d0d12"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="90" x2="422" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Orbit rings (atom / focus motif) -->
  <g transform="translate(256,256)" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round">
    <ellipse rx="150" ry="66" transform="rotate(0)"/>
    <ellipse rx="150" ry="66" transform="rotate(60)"/>
    <ellipse rx="150" ry="66" transform="rotate(120)"/>
  </g>

  <!-- Nucleus -->
  <circle cx="256" cy="256" r="34" fill="#eafff5"/>
  <circle cx="256" cy="256" r="34" fill="url(#accent)" opacity="0.55"/>
</svg>
